submission:
  title: "Netra — Integrated CCTV Video Management & Person Tracking"   # REQUIRED

  problem_statement: >                 # REQUIRED
    Government departments (police, transport, municipal) run thousands of CCTV
    cameras in separate silos, so nobody can search across them. Finding a missing
    or wanted person means operators manually scrubbing hours of footage from
    camera to camera, which delays response when minutes matter.

  solution_summary: >                  # REQUIRED
    Netra is a microservice platform that pulls live RTSP feeds from a unified
    camera registry, samples and batches frames, and runs face detection and
    recognition (InsightFace ArcFace embeddings stored in pgvector). Faces are
    matched against missing/wanted watchlists in real time to push alerts over
    WebSocket, and any operator can upload a photo to find every past sighting
    across cameras on a map and timeline.

  key_features:                        # REQUIRED
    - "Multi-camera ingestion: per-camera RTSP workers, ~5 fps sampling, bounded buffers, batching and back-pressure-aware dispatch to the AI services"
    - "Face detection + 512-dim ArcFace embeddings (InsightFace buffalo_l) for every sampled frame"
    - "Real-time missing/wanted watchlist matching via cosine distance in pgvector, with per-camera cooldown and live WebSocket alerts"
    - "Photo-based person search across all cameras with a sighting timeline and movement trail map"
    - "Camera registry and React dashboard: Leaflet camera map, bulk import/export, gap analysis, alert feed"
    - "Privacy-aware retention: unmatched detections are auto-deleted after 48 hours"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React 18", "Vite", "SQLAlchemy", "Leaflet"]
    ibm_technologies: ["IBM Bob"]
    databases: ["PostgreSQL", "PostGIS", "pgvector"]
    other: ["Docker Compose", "InsightFace", "ONNX Runtime", "OpenCV", "WebSockets", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The full end-to-end pipeline actually runs: camera frames flow through
    ingestion, face recognition and watchlist matching, and end up as a live alert
    on the dashboard. The vector-search design (one pgvector table serving both
    real-time matching and after-the-fact photo search) and the back-pressure
    handling in ingestion are the parts most worth reading in the source.

  known_limitations: >
    Vehicle AI (number plate) is wired into ingestion but not implemented in this
    submission. Authentication is limited to a shared service key between services;
    there is no operator login and CORS is open, so this is a prototype, not
    production-ready. Face inference runs on CPU by default and the camera feeds in
    the sample data point at demo hosts. There are no automated tests yet.

